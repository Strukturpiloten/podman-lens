---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/podman-lens' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@264c1ee33544faaa02cedd38d75a0b1d51c36241 # automation-v1 interface v1
    with:
      automation-sha: 264c1ee33544faaa02cedd38d75a0b1d51c36241
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
