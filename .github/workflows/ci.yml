---
name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      profile: ${{ steps.plan.outputs.profile }}
      select_rust: ${{ steps.plan.outputs.select_rust }}
      select_coverage: ${{ steps.plan.outputs.select_coverage }}
      select_msrv: ${{ steps.plan.outputs.select_msrv }}
      select_dependencies: ${{ steps.plan.outputs.select_dependencies }}
      select_api: ${{ steps.plan.outputs.select_api }}
      select_documentation: ${{ steps.plan.outputs.select_documentation }}
      select_lockfile_release_age: ${{ steps.plan.outputs.select_lockfile_release_age }}
    steps:
      - name: Check out exact tested revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted PR base validation policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .validation-base
          persist-credentials: false
      - name: Select exact-revision validation plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
            if [[ -f .validation-base/scripts/validation-plan.py &&
                  -f .validation-base/scripts/validation-policy.json ]]; then
              python3 .validation-base/scripts/validation-plan.py plan \
                --repository-root "${GITHUB_WORKSPACE}" \
                --policy-root .validation-base \
                --event pull_request --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
                --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
            else
              # First rollout: never execute a PR-head classifier without trusted base policy.
              python3 - <<'PY'
          import json
          import os
          import re

          jobs = "rust coverage msrv dependencies api documentation lockfile-release-age".split()
          base, head, tested = (os.environ[key] for key in ("BASE_SHA", "HEAD_SHA", "GITHUB_SHA"))
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head, tested)):
              raise SystemExit("first-rollout comparison has an invalid SHA")
          plan = {"schema": 2, "repository": "Strukturpiloten/podman-lens", "event": "pull_request",
                  "base_sha": base, "head_sha": head, "tested_sha": tested, "profile": "full",
                  "jobs": {job: True for job in jobs}, "reasons": ["trusted base has no classifier"],
                  "local_fingerprint": None}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan=" + json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\nprofile=full\n")
              for job in jobs:
                  output.write("select_" + job.replace("-", "_") + "=true\n")
          PY
            fi
          else
            python3 scripts/validation-plan.py plan --event "${EVENT_NAME}" \
              --tested-sha "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi
  rust:
    name: Rust quality
    needs: validation-plan
    if: needs.validation-plan.outputs.select_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo ci-check
      - run: cargo ci-policy
      - run: cargo ci-clippy
      - run: cargo ci-test
      - name: Check captured native release contract
        run: bash scripts/check-native-release-contract.sh
      - run: cargo ci-doctest
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo ci-doc
      - run: cargo ci-package
  coverage:
    name: Coverage measurement
    needs: validation-plan
    if: needs.validation-plan.outputs.select_coverage == 'true'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - run: rustup component add llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        # renovate: datasource=crate depName=cargo-llvm-cov
        run: cargo install --locked --version 0.9.0 cargo-llvm-cov
      - run: cargo llvm-cov clean --locked
      - run: cargo llvm-cov --locked --no-clean --workspace --all-features --all-targets --summary-only
  msrv:
    name: MSRV
    needs: validation-plan
    if: needs.validation-plan.outputs.select_msrv == 'true'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '[.packages[].rust_version] | unique | if length == 1 and .[0] != null then .[0] else error("workspace packages must declare one common rust-version") end')"
          printf 'msrv=%s\n' "${msrv}" >> "${GITHUB_OUTPUT}"
      - env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: rustup toolchain install "${RUST_MSRV}" --profile minimal
      - env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-check
      - env:
          RUST_MSRV: ${{ steps.metadata.outputs.msrv }}
        run: cargo "+${RUST_MSRV}" ci-policy
  dependencies:
    name: Dependency and license policy
    needs: validation-plan
    if: needs.validation-plan.outputs.select_dependencies == 'true'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
  api:
    name: Public API compatibility
    needs: validation-plan
    if: needs.validation-plan.outputs.select_api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare published API or check initial public contract
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --user-agent 'PodmanLens CI (+https://github.com/Strukturpiloten/podman-lens)' --output /dev/null --write-out '%{http_code}' https://crates.io/api/v1/crates/podman-lens)"
          case "${status}" in
            200)
              cargo install --locked --version 0.50.0 cargo-semver-checks
              bash scripts/check-public-api.sh
              ;;
            404)
              cargo test --locked --test public_api
              ;;
            *)
              printf 'Unexpected crates.io response for podman-lens: HTTP %s\n' "${status}" >&2
              exit 1
              ;;
          esac
  documentation:
    name: Repository files and documentation
    needs: validation-plan
    if: needs.validation-plan.outputs.select_documentation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.21.0
          cache: npm
      - name: Install locked Node file-quality tools
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Install checksum-pinned file-quality tools as the runner user
        shell: bash
        run: |
          set -euo pipefail
          file_tool_bin="$(mktemp -d "${RUNNER_TEMP}/podman-lens-file-tools.XXXXXXXX")"
          bash scripts/install-file-tools.sh "${file_tool_bin}"
          printf '%s\n' "${file_tool_bin}" >> "${GITHUB_PATH}"
      - run: bash scripts/check-files.sh --check
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-validation-plan.py
      - run: bash scripts/check-release-metadata.sh
      - name: Check changed public guides
        if: fromJSON(needs.validation-plan.outputs.plan).profile == 'executable-docs'
        run: cargo test --locked --test public_guides
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir '${{ github.workspace }}' --offline './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
  lockfile-release-age:
    name: Lockfile release age
    needs: validation-plan
    if: needs.validation-plan.outputs.select_lockfile_release_age == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the aggregate result outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'Lockfile release-age comparison applies to pull requests.'
      - name: Check out the exact pull-request candidate and base history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the shared lockfile policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/.github
          # renovate: datasource=github-digest depName=Strukturpiloten/.github currentValue=main
          ref: a9e003816709ccac55e761e5ef8a884d4359c853
          path: .github/strukturpiloten-shared
          persist-credentials: false
      - name: Reject newly introduced dependencies younger than three days
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/strukturpiloten-shared/scripts/lockfile_release_age.py
          --repository-root "${GITHUB_WORKSPACE}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --minimum-age-hours 72
  pr-gate:
    name: PR gate
    if: always()
    needs:
      [
        validation-plan,
        rust,
        coverage,
        msrv,
        dependencies,
        api,
        documentation,
        lockfile-release-age,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out trusted PR base aggregate verifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .validation-base
          persist-credentials: false
      - name: Check exact-plan aggregate
        shell: bash
        env:
          PLAN_JSON: ${{ needs.validation-plan.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'pull_request' &&
                ( ! -f .validation-base/scripts/validation-plan.py ||
                  ! -f .validation-base/scripts/validation-policy.json ) ]]; then
            python3 - <<'PY'
          import json
          import os

          jobs = "rust coverage msrv dependencies api documentation lockfile-release-age".split()
          plan = json.loads(os.environ["PLAN_JSON"])
          needs = json.loads(os.environ["NEEDS_JSON"])
          if (plan.get("schema") != 2 or plan.get("repository") != "Strukturpiloten/podman-lens"
                  or plan.get("event") != "pull_request" or plan.get("profile") != "full"
                  or plan.get("base_sha") != os.environ["BASE_SHA"]
                  or plan.get("head_sha") != os.environ["HEAD_SHA"]
                  or plan.get("tested_sha") != os.environ["GITHUB_SHA"]
                  or plan.get("jobs") != {job: True for job in jobs}
                  or set(needs) != {"validation-plan", *jobs}):
              raise SystemExit("first-rollout validation plan mismatch")
          for name in ("validation-plan", *jobs):
              if needs[name].get("result") != "success":
                  raise SystemExit(f"first-rollout required job {name} did not succeed")
          print("First-rollout complete validation passed")
          PY
          else
            verifier=scripts/validation-plan.py
            policy_root=.
            if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
              verifier=.validation-base/scripts/validation-plan.py
              policy_root=.validation-base
            fi
            python3 "${verifier}" gate --policy-root "${policy_root}" --event "${EVENT_NAME}" \
              --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
              --tested-sha "${GITHUB_SHA}" --plan-json "${PLAN_JSON}" --needs-json "${NEEDS_JSON}"
          fi
