---
name: Qualify Dev Container feature updates
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  qualify:
    if: >-
      github.repository == 'Strukturpiloten/podman-lens' &&
      github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
      github.event_name == 'workflow_dispatch'
    uses: Strukturpiloten/boxferry/.github/workflows/shared-devcontainer-updates.yml@c4e49870d55d8d88624b25c6c0c3c319dd6d4398 # automation-v1 interface v1
    with:
      automation-sha: c4e49870d55d8d88624b25c6c0c3c319dd6d4398
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
