---
name: Release

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Validate the exact candidate without any publication action.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_GITHUB_API_VERSION: "2026-03-10"

jobs:
  deterministic:
    name: Complete deterministic CI
    if: github.repository == 'Strukturpiloten/podman-lens'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-metadata:
    name: Release metadata
    if: github.repository == 'Strukturpiloten/podman-lens'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive and validate release metadata
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
            echo "Run releases from the default branch (${DEFAULT_BRANCH})." >&2
            exit 1
          }
          bash scripts/check-release-metadata.sh
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "podman-lens") | .version')"
          notes="${RUNNER_TEMP}/podman-lens-release-notes-${version}.md"
          bash scripts/extract-release-notes.sh "${version}" > "${notes}"
          {
            printf 'version=%s\n' "${version}"
            printf 'tag=v%s\n' "${version}"
            printf 'notes=%s\n' "${notes}"
          } >> "${GITHUB_OUTPUT}"

  native-conformance:
    name: Native API conformance
    if: github.repository == 'Strukturpiloten/podman-lens'
    uses: ./.github/workflows/native-podman-conformance.yml
    permissions:
      contents: read

  semver:
    name: SemVer
    needs: deterministic
    if: needs.deterministic.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check published baseline
        id: baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --user-agent 'PodmanLens release workflow (+https://github.com/Strukturpiloten/podman-lens)' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output /dev/null --write-out '%{http_code}' 'https://crates.io/api/v1/crates/podman-lens')"
          case "${status}" in
            200) echo 'published=true' >> "${GITHUB_OUTPUT}" ;;
            404) echo 'published=false' >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unexpected crates.io response: HTTP ${status}." >&2; exit 1 ;;
          esac
      - name: Check public API compatibility
        if: steps.baseline.outputs.published == 'true'
        shell: bash
        run: |
          cargo install --locked --version 0.50.0 cargo-semver-checks
          bash scripts/check-public-api.sh

  release-gate:
    name: Release validation gate
    needs: [deterministic, release-metadata, native-conformance, semver]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require every validation prerequisite to succeed
        shell: bash
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          METADATA: ${{ needs.release-metadata.result }}
          NATIVE: ${{ needs.native-conformance.result }}
          SEMVER: ${{ needs.semver.result }}
        run: test "${DETERMINISTIC}:${METADATA}:${NATIVE}:${SEMVER}" = 'success:success:success:success'
      - name: Download current-run native evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: podman-lens-native-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-podman-6.1-*
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: false
      - name: Validate complete current-run native evidence
        shell: bash
        run: bash scripts/validate-native-evidence.sh "${RUNNER_TEMP}/native-evidence" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"

  publish:
    name: Publish PodmanLens
    needs: release-gate
    if: >-
      github.repository == 'Strukturpiloten/podman-lens' &&
      inputs.validation_only != true &&
      needs.release-gate.result == 'success'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive release metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "podman-lens") | .version')"
          notes="${RUNNER_TEMP}/podman-lens-release-notes-${version}.md"
          bash scripts/extract-release-notes.sh "${version}" > "${notes}"
          {
            printf 'version=%s\n' "${version}"
            printf 'tag=v%s\n' "${version}"
            printf 'notes=%s\n' "${notes}"
            printf 'crate=target/package/podman-lens-%s.crate\n' "${version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build release package and checksum
        env:
          CRATE: ${{ steps.metadata.outputs.crate }}
        run: |
          cargo ci-package
          sha256sum "${CRATE}" > "${CRATE}.sha256"
      - name: Attest release package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.metadata.outputs.crate }}
      - name: Create or verify annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            [[ "$(git rev-list -n 1 "${TAG}")" == "${GITHUB_SHA}" ]]
          else
            tag_object_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" --header "X-GitHub-Api-Version: ${RELEASE_GITHUB_API_VERSION}" -f tag="${TAG}" -f message="PodmanLens ${TAG}" -f object="${GITHUB_SHA}" -f type=commit --jq '.sha')"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" --header "X-GitHub-Api-Version: ${RELEASE_GITHUB_API_VERSION}" -f ref="refs/tags/${TAG}" -f sha="${tag_object_sha}"
          fi
      - name: Create or replace draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.metadata.outputs.notes }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --draft --title "PodmanLens ${VERSION}" --notes-file "${NOTES}"
          fi
      - name: Upload draft GitHub release assets
        env:
          CRATE: ${{ steps.metadata.outputs.crate }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "${TAG}" --clobber "${CRATE}" "${CRATE}.sha256"
      - name: Check crates.io publication state
        id: registry
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -Eeuo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --user-agent 'PodmanLens release workflow (+https://github.com/Strukturpiloten/podman-lens)' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/podman-lens/${VERSION}")"
          case "${status}" in
            200) echo 'published=true' >> "${GITHUB_OUTPUT}" ;;
            404) echo 'published=false' >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unexpected crates.io response: HTTP ${status}." >&2; exit 1 ;;
          esac
      - name: Authenticate crates.io trusted publishing
        id: crates-auth
        if: steps.registry.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false --latest
